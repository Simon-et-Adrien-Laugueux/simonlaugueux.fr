<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Image de partage (1200×630)</title>
  <!-- Modèle de assets/img/partage.png, rendu par tools/og_image.py.
       Tout ce qui compte tient dans le carré central de 630 px :
       WhatsApp et d'autres applications recadrent l'aperçu en carré. -->
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      font-weight: 600 700;
      src: url("../assets/fonts/cormorant-garamond-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Lato";
      font-weight: 700;
      src: url("../assets/fonts/lato-700-latin.woff2") format("woff2");
    }
    :root {
      --parchemin: #F6EFE3;
      --camel: #C19A6B;
      --ocre: #CC7722;
      --ocre-fonce: #8F4E0F;
      --chene: #2A1D14;
      --malbec: #5A1F2B;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      /* Fond du bandeau d'accueil du site ; les veines de bois.svg sont très
         légères (4 %), on les superpose trois fois pour qu'elles se voient
         une fois l'image réduite en vignette. */
      background:
        url("../assets/img/bois.svg") center / cover no-repeat,
        url("../assets/img/bois.svg") center / cover no-repeat,
        url("../assets/img/bois.svg") center / cover no-repeat,
        linear-gradient(135deg, var(--camel) 0%, var(--ocre) 100%);
      color: var(--chene);
      font-family: "Lato", sans-serif;
    }
    .carte {
      position: relative;
      box-sizing: border-box;
      width: 600px;
      padding: 40px 28px 36px;
      border-radius: 14px;
      background: var(--parchemin);
      box-shadow: 0 18px 50px rgba(42, 29, 20, 0.35);
      text-align: center;
    }
    .carte img {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
    }
    .surtitre {
      margin: 0 0 6px;
      color: var(--ocre-fonce);
      font-size: 20px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: 76px;
      white-space: nowrap;
      font-weight: 700;
      line-height: 1.05;
    }
    .filet {
      width: 64px;
      height: 3px;
      margin: 18px auto;
      background: var(--ocre);
    }
    .sous-titre {
      margin: 0;
      color: var(--malbec);
      font-family: "Cormorant Garamond", serif;
      font-size: 40px;
      font-weight: 600;
      line-height: 1.15;
    }
    .domaine {
      margin: 22px 0 0;
      font-size: 18px;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="carte">
    <img src="../assets/img/barrique.svg" alt="">
    <p class="surtitre">Cahors &amp; le Lot</p>
    <h1>Simon Laugueux</h1>
    <div class="filet"></div>
    <p class="sous-titre">Dégustations de vins<br>&amp; spiritueux</p>
    <p class="domaine">simonlaugueux.fr</p>
  </div>
</body>
</html>
