<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Icône iPhone/iPad (180×180)</title>
  <!-- Modèle de assets/img/apple-touch-icon.png, rendu par tools/og_image.py.
       Le favicon sur un fond plein ocre : iOS arrondit lui-même les coins
       et remplit la transparence en noir. -->
  <style>
    html, body {
      margin: 0;
      width: 180px;
      height: 180px;
      overflow: hidden;
      background: #CC7722;
    }
    img {
      display: block;
      width: 180px;
      height: 180px;
    }
  </style>
</head>
<body>
  <img src="../assets/img/favicon.svg" alt="">
</body>
</html>
